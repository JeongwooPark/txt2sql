[project]
name = "llm2sql"
version = "0.1.2"
description = "자연어 질의를 PostgreSQL SQL로 변환해 실행합니다 (Ollama)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlglot>=26.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
llm2sql = "llm2sql.cli:main"
llm2sql-web = "llm2sql.webapp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm2sql"]

[tool.hatch.build.targets.wheel.force-include]
"llm2sql/webapp/static" = "llm2sql/webapp/static"