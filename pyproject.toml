[project]
name = "llm2sql"
version = "0.1.0"
description = "자연어 질의를 PostgreSQL SQL로 변환해 실행합니다 (Ollama)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
llm2sql = "llm2sql.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm2sql"]
