name: CI Regression Gate

on:
  push:
    branches: [semantic-architecture-v2, refactor/semantic-ir-main70]
  pull_request:
    branches: [semantic-architecture-v2, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Unit tests
        run: uv run pytest tests/ -x -q --ignore=tests/map_ui_gold500

      - name: QueryIR invariant tests
        run: uv run pytest tests/query_ir/ -q

      - name: Compiler tests
        run: uv run pytest tests/planner/ tests/semantic_plan/ -q

      - name: Benchmark artifact consistency
        run: uv run pytest tests/evaluation/test_benchmark_consistency.py -q

      - name: Semantic metamorphic / place scope tests
        run: uv run pytest tests/semantic_catalog/test_place_scope_binding.py tests/semantic_plan/test_place_scope_policy.py -q

      - name: Verify baseline manifest exists
        run: test -f artifacts/baselines/main_62_9/benchmark_manifest.json
